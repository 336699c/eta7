<script>
var element_init = {"ROUTEMAP":false,"TEST":1}
function changePage(viewId,element){
	if(!element)element = document.getElementById("TAB_"+viewId);
	const funcs = {
	"ROUTESTOP": (()=>{}),
	"ROUTEMAP": (()=>{iframe_map_handler("ROUTEMAP",true)}),
	"ROUTENOTE": (()=>{
		if(RT_dt.cos.includes("ctb"))$("#ROUTENOTE_iframe").attr("src",`https://mobile.citybus.com.hk/nwp3/getnotice.php?id=${RT_dt.route}`);
	}),
	}
	// 移除所有活动状态
	document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
	document.querySelectorAll('.content > div').forEach(view => view.classList.remove('active'));

	// 添加当前活动状态
	if(element)element.classList.add('active');
	//Object.keys(funcs).forEach(g=>{$("#"+g).css("display",viewId==g?"block":"none")});
	document.querySelector(`#${viewId}`).classList.add('active');

	if(!element_init[viewId]){
		element_init[viewId] = true;
		funcs[viewId]();
	}
}
document.querySelectorAll('.tab').forEach(tab => {
	tab.addEventListener('click', function() {
		changePage(this.getAttribute('data-view'),this)
		
	});
});


function overlay_on(xid){
var bookmarks = localStorage.getItem('bookmarks') || "[]";
bookmarks = JSON.parse(bookmarks);
while(document.getElementById("B").childNodes.length>0){document.getElementById("B").childNodes[0].remove()};
bookmarks.push({name:"新書簽",stops:[]});

var rownum = 0;
bookmarks.forEach((data,i)=>{
	if(data.stops.flat().includes(xid))return;

    var Row = document.getElementById("B").insertRow(rownum++);
	var but = Row.insertCell(0).appendChild(document.createElement('button'));
	but.className = "bookmark";
	but.innerHTML = `<pre style="display: inline;font-size:20px;">書簽${i} </pre>
	<label style="display: inline;font-size:10px;"> ${data.stops.map(w=>BusCrawling.getStopData(w[0]).name_tc).join("、<br>")} </label>`

	but.addEventListener('click', function() {
		var bookmarks = localStorage.getItem('bookmarks') || "[]";
		bookmarks = JSON.parse(bookmarks);

		if(bookmarks[i]){
			bookmarks[i].stops.push(BusCrawling.getSameStop(xid));
		}else{
			bookmarks.push({name:`書簽 ${i}`,stops:[BusCrawling.getSameStop(xid)]});
		}
		localStorage.setItem('bookmarks', JSON.stringify(bookmarks));
		alert(`已新增 ${BusCrawling.getStopData(xid).name_tc} 至書簽#${i}`);
		document.getElementById("overlay").style.display = "none";
	})
    });
	
document.getElementById("overlay").style.display = "block";
}

function overlay_off(){
	document.getElementById("overlay").style.display = "none";
}
</script>

<script>
var BusCrawling = new BusCrawling();
var BusCrawlingData;
BusCrawling.data().then(res=>{BusCrawlingData=res;regen()});

var ETAList = new ETAList();
var RT_dt = {};

var RT_data = [];


const bilingual = localStorage.getItem('bilingual') === 'true';
const lang = bilingual?"tc": localStorage.getItem('language') || "tc";
const lang2 = lang=="tc"?"zh":lang;

//"company" = operator stop id (KMB 16-hex / CTB 6-digit), "code" = eta6 stop code
const stopIdMode = localStorage.getItem('stopIdMode') || "company";
const coopStopName = localStorage.getItem('coopStopName') || "auto";

/**
 * Stop name for one row. Coop routes can take the CTB or KMB published name;
 * per-operator names only exist for English.
 */
function stopNameFor(id){
	if(RT_dt.costops && coopStopName != "auto" && lang2 == "en"){
		var rec = BusCrawlingData.stopList[id];
		var key = coopStopName == "kmb" ? "KMB" : "CTB";
		if(rec && rec.byCo && rec.byCo[key])return rec.byCo[key];
	}
	return BusCrawlingData.stopList[id].name[lang2];
}

/** "Fare: $8.8 / $9.4" – every fare that applies from this stop. */
function fareLabel(i){
	var list = RT_dt.fares[i];
	if(!list || !list.length)return "";
	return "<br>" + _bundles.fare[lang] + ": $" + list.join(" / $");
}

//MODE_1 byroute INIT
var TimeDisplay = false;

function TimerSettings(){
	TimeDisplay = !TimeDisplay;
	if(TimeDisplay){
		$("#TimerSettings").addClass("TimerSettingsLong");
		$("#TimerSettings")[0].innerHTML = "";
	}
	else {
		$("#TimerSettings").removeClass("TimerSettingsLong");
		$("#TimerSettings")[0].innerHTML = `<img src="/eta7/icon/time_${(TimeDisplay?"act":"cd")}.png" class="img2">`;
	}
}

function regen(){
	var routeKey = decodeURI(document.location.href.split("?")[1]);
	console.log(routeKey);
	RT_dt.data = BusCrawlingData.routeList[routeKey];
	RT_dt.stops = Object.values(RT_dt.data.stops)[0];
	RT_dt.costops = Object.values(RT_dt.data.stops)[1];
	RT_dt.route = RT_dt.data.route;
	RT_dt.bound = Object.values(RT_dt.data.bound)[0];
	RT_dt.bounds = RT_dt.data.bound;
	RT_dt.serviceType = RT_dt.data.serviceType;
	RT_dt.codes = RT_dt.data.codes || [];
	RT_dt.fares = RT_dt.data.fares || [];
	RT_dt.co = RT_dt.data.co.join("+").toUpperCase();
	RT_dt.cos = RT_dt.data.co;
	RT_dt.repeat = RT_dt.stops.filter((w,i)=>RT_dt.stops.indexOf(w) != i);
	console.log(RT_dt.repeat);

	RT_data = Object.values(RT_dt.data.stops)[0];

	var resultT = document.getElementById("rttable").insertRow();
	var s3 = resultT.insertCell(0);
	var s4 = resultT.insertCell(0);
	var s2 = resultT.insertCell(0);
	var s1 = resultT.insertCell(0);
	

	let opposite = BusCrawling.getOppositeRoute(RT_dt.cos,RT_dt.route,RT_dt.bounds[RT_dt.cos[0]]);
	if(opposite.length>0)s3.innerHTML = `<a href="route3.html?${
	BusCrawling.getOppositeRoute(RT_dt.cos,RT_dt.route,RT_dt.bounds[RT_dt.cos[0]])[0][0]}"><button class="rev"><img src="/eta7/icon/route_rev.png" class="img2"></button></a>`
	
	s4.innerHTML = `<button class="TimerSettings" id="TimerSettings" onclick="TimerSettings()"><img src="/eta7/icon/time_cd.png" class="TimerDisplay img2"></button>`
	document.title = `${RT_dt.route}  ${RT_dt.data.dest.zh}`;
	s2.innerHTML = `<label style="font-family: 'Helvetica';font-size:0.9em"><b>${RT_dt.route.padEnd(4," ")}</b> <label style="font-size:0.75em"><small><small>${_bundles.to[lang]} </small></small>${RT_dt.data.dest[lang2]}</label></label>`
	s1.className ="s1";
	s2.className ="s2";
	s3.className ="s3";
	s4.className ="s4";
	s1.innerHTML = `<img src="/eta7/icon/${_T.busIMG(RT_dt.co,RT_dt.route)}.png" style="width:30px">`
	
	var stoplist = document.getElementById("stoptable");
	RT_dt.stopNickname = [];
	RT_dt.stops.forEach((w,i)=>{
		var s = stoplist.insertRow().insertCell(0);
		s.className = "rss";
		s.id = "rss_"+w;

		var stopName = stopNameFor(w);
		var k,displayName=[stopName,""];
		
		if(k=stopName.split(","),k.length>1){
			displayName = [k[0],k.slice(1).join(",")];
		}else if(/\([A-Za-z]+\d+\)/.test(stopName)){
			displayName = [stopName.replace(/\([A-Za-z]+\d+\)/g,""),stopName.match(/\([A-Za-z]+\d+\)/g).join("")];
		}
		if(/.+轉車站 ?- ?/.test(displayName[0])){
			displayName[1] = "> BBI: " + displayName[0].match(/(.+)轉車站 ?- ?/)[1] + "轉車站 " + displayName[1];
			displayName[0] = displayName[0].replace(/.+轉車站 ?- ?/,"");
		}
		if(RT_dt.co=="KMB" && lang=="en")displayName[0] = BusCrawling.toSentenceCase(displayName[0]);
		const stopNumber = localStorage.getItem('stopNumber') === 'true';
		RT_dt.stopNickname.push(displayName[0]);

		s.innerHTML = `<button onclick="click2('${w}', ${i+1}, ${RT_dt.costops?"'"+RT_dt.costops[i]+"'":""})" class="rss"><table class="stoptable"><td class="stopid2"><label class="stopid">${i+1}</label></td><td class="stopname3">
			<label class="stopname2"><big>${displayName[0]}</big>${fareLabel(i)}<br><small><small>${displayName[1]} ${!stopNumber ? "" : (stopIdMode=="code" ? (RT_dt.codes[i]||w) : w + (RT_dt.costops?" "+RT_dt.costops[i]:""))}</small></small></label></td></div>
			<td class="bus" id="bus_${w}_${i+1}"> </td><td class="eta" id="eta_${w}_${i+1}"></td></table></button><div id="stop_${w}">`
	});
	getETA();
	renderVariantSelector(routeKey);
}

/**
 * Draw the route variant panel: one gray bar showing the variant currently
 * opened (green / red circle = departure within the next 60 minutes), which
 * expands into the list of every serviceType of this route and direction.
 * The description follows the route2 rules, with "正常路線" for the base variant.
 * @param {string} key - routeFareList key of the page being displayed
 */
function renderVariantSelector(key){
	var panel = document.getElementById("variant_panel");
	var list = document.getElementById("variant_list");
	var variants = BusCrawling.getRouteVariants(key);

	if(!variants || variants.length==0){
		panel.classList.add("hidden");
		return;
	}
	panel.classList.remove("hidden");
	panel.classList.remove("open");

	var esc = function(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");};
	var curSvc = parseInt(RT_dt.data.serviceType)||1;
	var baseSvc = variants[0].svc;
	var current = variants.filter(function(v){return v.svc==curSvc;})[0] || variants[0];

	function descOf(v){
		if(v.svc==baseSvc)return "正常路線";
		return v.desc || v.serviceText || "";
	}
	function rowHTML(v, cls){
		return '<div class="variant_row '+cls+'" data-key="'+esc(encodeURI(v.key))+'">'
			+ '<div class="variant_badge '+(v.departure60?'green':'red')+'">'+v.svc+'</div>'
			+ '<div class="variant_desc">'+esc(descOf(v))+'</div>'
			+ '<div class="variant_chevron">⌄</div>'
			+ '</div>';
	}

	var html = '<div class="variant_row variant_current" id="variant_toggle">'
		+ '<div class="variant_badge '+(current.departure60?'green':'red')+'">'+current.svc+'</div>'
		+ '<div class="variant_desc">'+esc(descOf(current))+'</div>'
		+ (variants.length>1 ? '<div class="variant_chevron">⌄</div>' : '')
		+ '</div>';

	if(variants.length>1){
		html += '<div class="variant_options hidden" id="variant_options">'
			+ variants.map(function(v){return rowHTML(v, v.svc==curSvc?"current":"");}).join("")
			+ '</div>';
	}
	list.innerHTML = html;
}

/**
 * Toggle the variant list, or navigate to the selected variant.
 */
(function bindVariantPanel(){
	var list = document.getElementById("variant_list");
	var panel = document.getElementById("variant_panel");
	list.addEventListener("click", function(e){
		var target = e.target;
		if(!target.closest)return;

		var opt = target.closest("#variant_options .variant_row");
		if(opt){
			changeVariant(opt.getAttribute("data-key"));
			return;
		}
		var toggle = target.closest("#variant_toggle");
		var options = document.getElementById("variant_options");
		if(toggle && options){
			options.classList.toggle("hidden");
			panel.classList.toggle("open");
		}
	});
})();

/**
 * Navigate to the selected route variant.
 * @param {string} k - URL-encoded routeFareList key
 */
function changeVariant(k){
	if(!k)return;
	window.location.href = "route3.html?" + k;
}

//MODE 1 ETA
var ETA_RESULT={};
var COJOIN_ETA=false;
var counter = 0;


function apply_eta(s){
	/*RawETA[]*/ s = ETAList.byroute(RT_dt.cos, RT_dt.route, RT_dt.bounds);
	s.forEach((w,i)=>{
		if(!document.getElementById("bus_"+w.stop+"_"+w.seq))return;
		document.getElementById("bus_"+w.stop+"_"+w.seq).innerHTML = (()=>{switch(w.route_bus){
			case 0:
				return "";
			break;
			case 1:
				return `<img src="/eta7/icon/${_T.busIMG(w.data()[0].co,RT_dt.route)}.png" style="width:30px">`;
			break;
			default:
				return `<div style="position:relative"><img src="/eta7/icon/${_T.busIMG(w.data()[0].co,RT_dt.route)}.png" style="width:30px; filter:brightness(60%)">
					<div style="position:absolute;left: 7px;top: 1px"><span style="font-size:18px;font-weight:bold;color:#fff;">
						<small><small>x</small></small>${w.route_bus}
						</span></div>
						</div>`;
			break;	
		}
		})();
		
		document.getElementById("eta_"+w.stop+"_"+w.seq).innerHTML = w.formatETAString({mode:TimeDisplay?1:0, cos:RT_dt.cos.length>1, small:true});
	});
}

//MODE 1 
function click2(s,n,w){
document.getElementById("stop_"+s).innerHTML = `
<div class="StopSelectionDIV flex-vert">
<div class="StopSelectionDIV">
		<button onclick="overlay_on('${s}')" class="action-btn">
			🔖<br>書簽
		</button>
		<button onclick="changePage('ROUTEMAP'),__MARKER_STATS.markers[${n-1}].openPopup(),__MARKER_STATS.map.setView(__MARKER_STATS.markers[${n-1}].getLatLng(),16)" class="action-btn">
			🗺️<br>地圖
		</button>
		<button onclick="iframe_handler('${s}',1,'${w}')" class="action-btn">
			⇄<br>
			同站路綫
		</button>
		<button onclick="iframe_handler('${s}',0,'${w}')" class="action-btn">
			⏱️<br>車程
		</button>
</div>
<iframe src="${"stop-eta-bystop.html?color=1&stops="+BusCrawling.getSameStop(s)+"&CHG="+RT_dt.co+"_"+RT_dt.route+"_"+RT_dt.bound}" id="iframe_stop_${s}"></iframe>
<div id="div_stop_${s}"></div>
</div>
`
}

var initalized = [];
var __MARKER_STATS = {
	stopClicked : null,
	markers:[],
	map:null
}
function iframe_map_handler(s,t=null){
	var element;
	if(!t){
	$('#iframe_stop_'+s).hide();
	$('#div_stop_'+s).show();
	
	if(initalized.includes(s))return;
	initalized.push(s);
	// Where you want to render the map.
	element = document.getElementById('div_stop_'+s);
	// Height has to be set. You can do this in CSS too.
	element.style = 'height:400px;';
	}else{
		element = document.getElementById("ROUTEMAP_container");
		element.style = 'height:100%;';
		s = RT_dt.stops[0];
	}

	

	// Create Leaflet map on map element.
	var map = L.map(element);
	__MARKER_STATS.map=map;
	// Add OSM tile layer to the Leaflet map.
	L.tileLayer('http://{s}.tile.osm.org/{z}/{x}/{y}.png', {
		attribution: '&copy; <a href="http://osm.org/copyright">OpenStreetMap</a> contributors'
	}).addTo(map);

	// Target's GPS coordinates.
	var stopdetails = BusCrawling.getStopData(s);
	var target = L.latLng(stopdetails.lat, stopdetails.long);

	// Set map's center to target with zoom 14.
	map.setView(target, 16);

	// Place a marker on the same location.
	//L.marker(target).addTo(map);
	
	var points = [];
	var busstopIcon = L.icon({
    iconUrl: 'icon/stop.png',

    iconSize:     [20, 50], // size of the icon
    iconAnchor:   [10, 50], // point of the icon which will correspond to marker's location
    popupAnchor:  [0, -50] // point from which the popup should open relative to the iconAnchor
	});

	RT_data.forEach((w,id)=>{
		let currstopdata = BusCrawling.getStopData(w);
		var marker2 = L.marker([currstopdata.lat, currstopdata.long],{icon: busstopIcon})
		marker2.addTo(map);
		__MARKER_STATS.markers.push(marker2);
		points.push([currstopdata.lat, currstopdata.long]);
	
		var popup = marker2.bindPopup((id+1)+". "+currstopdata.name_tc);
		marker2.on('click',function(){
			if(__MARKER_STATS.stopClicked&&__MARKER_STATS.stopClicked.stop==w){
				changePage("ROUTESTOP",document.getElementById("TAB_ROUTESTOP"));
				document.getElementById('rss_'+__MARKER_STATS.stopClicked.stop).scrollIntoView({
				behavior: 'smooth', // 可选: 'auto' 或 'smooth'
				block: 'start' // 可选: 'start', 'center', 'end', 或 'nearest'
				});
				__MARKER_STATS.stopClicked = null;
			}else{
				__MARKER_STATS.stopClicked = {"id":id,"stop":w};
			}
		});
		if (s == w)popup.openPopup();
	});
	
	if(!RT_dt.data.gtfsId){
		L.polyline(points, {
            color: 'red',    // Line color
            weight: 4,        // Line width
            opacity: 0.5      // Line opacity
        	}).addTo(map);
		return;
	}


	fetch(`https://hkbus.github.io/route-waypoints/${RT_dt.data.gtfsId}-${RT_dt.data.bound[RT_dt.data.co[0]]}.json`).then(g=>g.json()).then(g=>{
		try{
			g.features[0].geometry.coordinates.forEach(w=>{
				//console.log(w);
			L.polyline(w.map(g=>[g[1],g[0]]), {
					color: 'red',    // Line color
					weight: 4,        // Line width
					opacity: 1      // Line opacity
			}).addTo(map)
			}
			)
		}catch(error){
			console.log("Draw ERR: ",error);
			L.polyline(points, {
            color: 'red',    // Line color
            weight: 4,        // Line width
            opacity: 0.5      // Line opacity
        	}).addTo(map);
		}
	})
	
}

function CTB_eta(rt,bound){	
	var counter = RT_data.length;
	COJOIN_ETA=false;
	var rp = [];
	RT_data.forEach((w,i)=>{
		ETAList.CTB_stop(rt,w,i+1,g=>{
			counter--;
			if (counter==0)apply_eta();
		}, ((RT_dt.bound=="OI" || RT_dt.bound == "IO") && RT_dt.repeat.includes(w)) ? RT_dt.bound[rp.includes(w)?1:0] : RT_dt.bounds.ctb);
		if(RT_dt.repeat && RT_dt.repeat.includes(w))rp.push(w);
	})
}

function NLB_eta(rt,bound,rtid){	
	var counter = RT_data.length;
	COJOIN_ETA=false;
	var rp = [];
	RT_data.forEach((w,i)=>{
		ETAList.NLB_stop(rtid,rt,w,i+1,g=>{
			counter--;
			if (counter==0)apply_eta();
		}, ((RT_dt.bound=="OI" || RT_dt.bound == "IO") && RT_dt.repeat.includes(w)) ? RT_dt.bound[rp.includes(w)?1:0] : RT_dt.bounds.ctb);
		if(RT_dt.repeat && RT_dt.repeat.includes(w))rp.push(w);
	})
}

/**
 * Joint routes (KMB+CTB / LWB+CTB): CTB is queried per stop, while KMB uses a
 * single route-eta request whose rows are attached to the CTB stop list.
 * Using route-eta keeps the request count low and avoids the per-stop API,
 * whose stop-id ranking can point at the wrong pole (missing ETAs).
 */
function jointETA(){
	var rows = RT_data.length;
	var pending = rows + 1;
	var done = function(){ if(--pending == 0)apply_eta(); };
	var circular = RT_dt.bound=="OI" || RT_dt.bound=="IO";
	var dest = RT_dt.data.dest && RT_dt.data.dest.zh;
	var rpC = [];

	RT_data.forEach((ctbId,i)=>{
		if(!/^\d{6}$/.test(ctbId)){ done(); return; }   // no real CTB stop id
		var bCtb = circular && RT_dt.repeat.includes(ctbId)
			? RT_dt.bound[rpC.includes(ctbId)?1:0] : RT_dt.bounds.ctb;
		ETAList.CTB_stop(RT_dt.route, ctbId, i+1, done, bCtb, {dest:dest});
		if(circular && RT_dt.repeat.includes(ctbId))rpC.push(ctbId);
	});

	ETAList.KMB_route2(RT_dt.route, RT_dt.costops, RT_dt.bounds.kmb, dest, RT_data,
		function(){ done(); });
}

function getETA(){
	if (RT_data && RT_dt.costops){
		jointETA();
	}else if (RT_dt.co=="KMB"){
		ETAList.KMB_route2(RT_dt.route, RT_data, RT_dt.bounds.kmb,
			RT_dt.data.dest && RT_dt.data.dest.zh, null);
	}else if (RT_dt.co=="LRTFEEDER"){
		ETAList.lrtfeeder(RT_dt.route,RT_dt.stops)
	}else if (RT_dt.co=="CTB"){
		CTB_eta(RT_dt.route,RT_dt.bound)
	}else if (RT_dt.co=="NLB"){
		if(RT_dt.data.nlbId){
			NLB_eta(RT_dt.route,RT_dt.bound,RT_dt.data.nlbId);
		}else{
			Eta6.nlbRouteId(RT_dt.route, RT_dt.data.dest && RT_dt.data.dest.zh).then(function(id){
				RT_dt.data.nlbId = id;
				NLB_eta(RT_dt.route,RT_dt.bound,id);
			});
		}
	}
}
