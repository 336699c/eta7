<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>路綫到站</title>
<link rel="icon" type="image/x-icon" href="icon/icon.png">
<style>
:root{--blue:#0056b8;--line:#e2e6ec;--muted:#7b8494;--warn:#c26a00;}
*{box-sizing:border-box;}
body{margin:0;background:#f5f6f8;color:#16181d;
 font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;-webkit-text-size-adjust:100%;}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
 padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);}
header .ttl{font-size:clamp(18px,5vw,26px);font-weight:700;color:var(--blue);}
header .meta{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:clamp(11px,3vw,14px);color:var(--muted);}
header button{border:none;background:transparent;font-size:clamp(20px,6vw,28px);line-height:1;padding:2px 6px;cursor:pointer;}
table{width:100%;border-collapse:collapse;background:#fff;}
tr.arr{border-bottom:1px solid var(--line);cursor:pointer;}
td{padding:10px 8px;vertical-align:middle;}
td.ic{width:52px;padding-right:0;}
td.ic img{width:32px;height:auto;display:block;}
td.rt{width:15%;font-size:clamp(16px,4.6vw,21px);font-weight:800;letter-spacing:.5px;}
td.mid{font-size:clamp(12px,3.4vw,15px);}
td.mid .dst{font-weight:600;}
td.mid .sub{font-size:clamp(10px,2.9vw,12px);color:var(--muted);margin-top:2px;}
td.mid .sub .code{font-variant-numeric:tabular-nums;}
td.mid .sub .nxt{color:#3a6f3a;}
td.eta{width:26%;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
td.eta .t{display:block;font-size:clamp(15px,4.4vw,19px);font-weight:700;color:var(--blue);}
td.eta .dl{font-size:clamp(9px,2.6vw,11px);color:var(--warn);}
td.eta .rmk{display:block;font-size:clamp(9px,2.6vw,11px);color:var(--warn);font-weight:400;}
.empty{padding:22px 14px;font-size:clamp(12px,3.4vw,15px);color:var(--muted);}
tr.prog td{background:#f8fafc;padding:10px 12px 12px 52px;}
.prog-t{font-size:clamp(10px,2.8vw,12px);color:var(--muted);margin-bottom:5px;letter-spacing:.5px;}
.prog-r{display:flex;gap:8px;align-items:baseline;font-size:clamp(11px,3vw,13px);padding:2px 0;}
.prog-r .s{width:26px;color:var(--muted);font-variant-numeric:tabular-nums;}
.prog-r .n{flex:1;}
.prog-r .e{color:var(--blue);font-variant-numeric:tabular-nums;}
.prog-e{font-size:clamp(11px,3vw,13px);color:var(--muted);}
#ovl{position:fixed;inset:0;z-index:20;background:rgba(10,15,25,.45);display:none;align-items:flex-end;}
#ovl.on{display:flex;}
.sheet{width:100%;max-height:88vh;background:#fff;border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden;}
.sheet-h{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);}
.sheet-h b{font-size:clamp(15px,4.2vw,19px);color:var(--blue);}
.sheet-h button{margin-left:auto;border:none;background:transparent;font-size:clamp(18px,5vw,24px);cursor:pointer;}
.sheet-b{overflow-y:auto;padding:6px 18px 28px;}
.grp{padding:12px 0;border-bottom:1px solid var(--line);}
.grp:last-child{border-bottom:none;}
.grp-t{font-size:clamp(11px,2.9vw,13px);color:var(--muted);letter-spacing:.5px;margin-bottom:8px;}
.opt{display:flex;align-items:center;gap:10px;width:100%;border:none;background:#f2f4f7;color:#16181d;
 font:inherit;font-size:clamp(13px,3.6vw,16px);text-align:left;padding:11px 13px;border-radius:9px;margin-bottom:7px;
 text-decoration:none;cursor:pointer;}
.opt.sel{background:var(--blue);color:#fff;}
.opt .lm{margin-left:auto;font-size:clamp(10px,2.7vw,12px);color:var(--muted);}
.opt.sel .lm{color:#dce8f8;}
.opt input{width:20px;height:20px;accent-color:var(--blue);margin:0;}
.rowline{display:flex;gap:8px;}
.save{width:100%;border:none;border-radius:10px;background:var(--blue);color:#fff;
 font-size:clamp(14px,3.8vw,17px);padding:13px;margin-top:12px;cursor:pointer;}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1d2430;color:#fff;
 font-size:clamp(11px,3vw,13px);padding:9px 16px;border-radius:20px;opacity:0;transition:opacity .25s;z-index:30;pointer-events:none;}
.toast.on{opacity:1;}
.p0{background:#fff !important}
.p1{background:#f7fbff !important}
.p2{background:#fdfaF4 !important}
.p3{background:#f6fdf8 !important}
</style>
</head>
<body>

<header>
  <div class="ttl">路綫到站</div>
  <div class="meta"><span id="upd"></span><button id="btn_cfg" title="設置">⚙</button></div>
</header>

<table id="tb"><tbody></tbody></table>
<div id="empty" class="empty" hidden>沒有途經此站的巴士</div>

<div id="ovl">
  <div class="sheet">
    <div class="sheet-h"><b>設置</b><button id="cfg_close" title="關閉">✕</button></div>
    <div class="sheet-b" id="cfg_body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="script/stop-eta-common.js"></script>
<script>
(function () {
"use strict";

var tbody = document.querySelector("#tb tbody");
var emptyBox = document.getElementById("empty");
var ovl = document.getElementById("ovl");
var cfgBody = document.getElementById("cfg_body");
var rowRefs = {};
var groupCos = {};

function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c];
    });
}

function hhmmss(d) {
    return [d.getHours(), d.getMinutes(), d.getSeconds()].map(function (n) {
        return ("0" + n).slice(-2);
    }).join(":");
}

/* every operator that serves one route/destination pair, for the joint icon */
function buildGroupCos() {
    groupCos = {};
    SE.stops.forEach(function (s) {
        s.rows.forEach(function (r) {
            var k = SE.groupKey(r);
            if (!groupCos[k]) groupCos[k] = {};
            groupCos[k][r.co] = 1;
        });
    });
}

function iconOf(row) {
    var cos = Object.keys(groupCos[SE.groupKey(row)] || {});
    if (!cos.length) cos = [row.co];
    return "icon/" + SE.iconFor(cos, row.route) + ".png";
}

function render() {
    document.getElementById("upd").textContent = "更新 " + hhmmss(new Date());
    rowRefs = {};
    buildGroupCos();

    var rows = SE.flatRows();
    tbody.innerHTML = "";
    emptyBox.hidden = rows.length > 0;

    rows.forEach(function (row) {
        var id = "r" + (Object.keys(rowRefs).length + 1);
        rowRefs[id] = row;
        var tr = document.createElement("tr");
        tr.className = "arr" + (SE.input.color ? " p" + (row.stopIndex % 4) : "");
        tr.setAttribute("data-rid", id);
        var sub = '<span class="code">' + esc(row.stopCode) + "</span> · "
            + esc(row.stopName) + (row.seq ? " · " + row.seq : "");
        var nxt = SE.nextStopInfo(row);
        if (nxt) {
            sub += '<br><span class="nxt">→ ' + esc(nxt.name) + " · " + nxt.distance + "m</span>";
        }
        tr.innerHTML = '<td class="ic"><img alt="" src="' + iconOf(row) + '"></td>'
            + '<td class="rt">' + esc(row.route) + "</td>"
            + '<td class="mid"><div class="dst">' + esc(row.dest) + "</div>"
            + '<div class="sub">' + sub + "</div></td>"
            + '<td class="eta"><b class="t" data-ts="' + row.eta + '">' + SE.etaText(row.eta) + "</b>"
            + (row.delay ? '<span class="dl">' + SE.delayText(row.delay) + "</span>" : "")
            + (SE.chgNote(row) ? '<span class="rmk">' + esc(SE.chgNote(row)) + "</span>" : "")
            + "</td>";
        tbody.appendChild(tr);
    });
}

function tick() {
    var list = document.querySelectorAll("b.t[data-ts]");
    for (var i = 0; i < list.length; i++) {
        list[i].textContent = SE.etaText(parseInt(list[i].getAttribute("data-ts"), 10));
    }
}

/* ---------- vehicle progress ---------- */

function showProgress(tr, row) {
    var next = tr.nextElementSibling;
    if (next && next.classList.contains("prog")) { next.remove(); return; }

    var trp = document.createElement("tr");
    trp.className = "prog";
    var td = document.createElement("td");
    td.colSpan = 4;
    td.textContent = "載入中…";
    trp.appendChild(td);
    tr.after(trp);

    SE.busProgress(row).then(function (list) {
        td.innerHTML = '<div class="prog-t">' + esc(row.route) + " 往 " + esc(row.dest) + "</div>";
        if (!list.length) {
            td.innerHTML += '<div class="prog-e">暫無位置資料</div>';
            return;
        }
        list.forEach(function (p) {
            td.innerHTML += '<div class="prog-r"><span class="s">' + p.seq + '</span>'
                + '<span class="n">' + esc(p.name) + "</span>"
                + '<span class="e">' + SE.etaText(p.eta) + "</span></div>";
        });
    });
}

/* ---------- settings sheet ---------- */

function opt(label, cls, extra) {
    return '<button class="opt ' + (cls || "") + '" ' + (extra || "") + ">" + label + "</button>";
}

function buildCfg() {
    var html = "";

    html += '<div class="grp"><div class="grp-t">預計抵站時間</div>'
        + opt("倒數分鐘", SE.input.time == 0 ? "sel" : "", 'data-time="0"')
        + opt("抵站時分", SE.input.time == 1 ? "sel" : "", 'data-time="1"')
        + "</div>";

    html += '<div class="grp"><div class="grp-t">顯示方式</div>'
        + '<a class="opt" href="' + esc(SE.viewURL("stop-eta-bystop.html")) + '">分站顯示'
        + '<span class="lm">按車站分組 ›</span></a>'
        + opt("路綫顯示", "sel", 'data-cur="1"') + "</div>";

    html += '<div class="grp"><div class="grp-t">選擇巴士站</div>';
    SE.stops.forEach(function (s) {
        html += '<label class="opt"><input type="checkbox" data-stop="' + esc(s.code) + '"'
            + (SE.hiddenStops[s.code] ? "" : " checked") + ">" + esc(s.name_tc)
            + '<span class="lm">' + esc(s.code) + "</span></label>";
    });
    html += "</div>";

    html += '<div class="grp"><div class="grp-t">選擇路綫</div>'
        + '<div class="rowline">' + opt("全部顯示", "", 'data-routeall="1"')
        + opt("清除全部", "", 'data-routeall="0"') + "</div>";
    SE.routeKeys().forEach(function (k) {
        var hidden = SE.input.nort.indexOf(k.key) >= 0;
        html += '<label class="opt"><input type="checkbox" data-route="' + esc(k.key) + '"'
            + (hidden ? "" : " checked") + ">" + esc(k.route) + " 往 " + esc(k.dest)
            + '<span class="lm">' + esc(k.cos.join("+")) + "</span></label>";
    });
    html += "</div>";

    html += '<div class="grp"><div class="grp-t">外觀</div>'
        + '<label class="opt"><input type="checkbox" data-color="1"'
        + (SE.input.color ? " checked" : "") + ">車站顏色間條</label></div>";

    html += '<div class="grp"><div class="grp-t">書簽</div>'
        + '<button class="save" data-save="1">儲存為書簽</button></div>';

    cfgBody.innerHTML = html;
}

function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("on");
    setTimeout(function () { t.classList.remove("on"); }, 1600);
}

/* ---------- events ---------- */

tbody.addEventListener("click", function (e) {
    var tr = e.target.closest("tr.arr");
    if (!tr || e.target.closest("tr.prog")) return;
    showProgress(tr, rowRefs[tr.getAttribute("data-rid")]);
});

document.getElementById("btn_cfg").addEventListener("click", function () {
    buildCfg();
    ovl.classList.add("on");
});

document.getElementById("cfg_close").addEventListener("click", function () {
    ovl.classList.remove("on");
});

ovl.addEventListener("click", function (e) {
    if (e.target === ovl) ovl.classList.remove("on");
});

cfgBody.addEventListener("click", function (e) {
    var el = e.target.closest("[data-time]");
    if (el) { SE.setTime(parseInt(el.getAttribute("data-time"), 10)); buildCfg(); return; }

    el = e.target.closest("[data-routeall]");
    if (el) {
        SE.setAllRoutes(el.getAttribute("data-routeall") === "0");
        buildCfg();
        return;
    }

    el = e.target.closest("[data-save]");
    if (el) {
        SE.saveBookmark();
        toast("已儲存書簽");
    }
});

cfgBody.addEventListener("change", function (e) {
    var t = e.target;
    if (t.hasAttribute("data-stop")) {
        SE.toggleStop(t.getAttribute("data-stop"));
    } else if (t.hasAttribute("data-route")) {
        SE.toggleRoute(t.getAttribute("data-route"));
    } else if (t.hasAttribute("data-color")) {
        SE.setColor(t.checked);
    }
});

SE.init(function (isTick) {
    if (isTick) tick();
    else { render(); if (ovl.classList.contains("on")) buildCfg(); }
});
})();
</script>
</body>
</html>
